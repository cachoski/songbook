<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoke Songbook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen" onclick="hideSuggestions()">

  <div class="max-w-4xl mx-auto p-4">
    <!-- Header -->
    <header class="flex justify-between items-center py-4 mb-2 border-b-2 border-red-700">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-[#C8102E] tracking-wider flex items-center gap-2">
          🎤 KARAOKE SONGBOOK
        </h1>
        <p class="text-xs text-gray-600 mt-1 font-semibold">Classic Physical Songbook Theme</p>
      </div>
    </header>

    <!-- Search & Filters Header -->
    <div class="sticky top-0 z-20 bg-gray-100 pt-2 pb-3">
      <div class="relative" onclick="event.stopPropagation()">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search song #, title, or artist..." 
          class="w-full p-4 pl-12 rounded-2xl bg-white border-2 border-red-600 text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-md text-base sm:text-lg font-medium"
          oninput="handleSearchInput()"
          onfocus="handleSearchInput()"
          autocomplete="off"
        />
        <span class="absolute left-4 top-4 text-gray-400 text-xl">🔍</span>

        <!-- Autocomplete Suggestions Dropdown -->
        <div id="suggestionsBox" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border-2 border-red-600 rounded-xl shadow-2xl z-30 max-h-60 overflow-y-auto divide-y divide-gray-100">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Main Category Filter Tabs -->
      <div class="flex gap-2 mt-3 overflow-x-auto no-scrollbar pb-1 text-sm font-bold">
        <button onclick="setCategory('ALL')" id="btn-ALL" class="cat-btn px-4 py-2 rounded-xl bg-[#C8102E] text-white shadow">All Songs</button>
        <button onclick="setCategory('FAV')" id="btn-FAV" class="cat-btn px-4 py-2 rounded-xl bg-white hover:bg-yellow-100 text-yellow-600 border border-gray-300">⭐ Favorites</button>
        <button onclick="setCategory('2026')" id="btn-2026" class="cat-btn px-4 py-2 rounded-xl bg-white hover:bg-emerald-100 text-emerald-700 border border-gray-300">✨ 2026 Hits</button>
        <button onclick="setCategory('OPM')" id="btn-OPM" class="cat-btn px-4 py-2 rounded-xl bg-white hover:bg-gray-200 text-gray-800 border border-gray-300">OPM</button>
        <button onclick="setCategory('English')" id="btn-English" class="cat-btn px-4 py-2 rounded-xl bg-white hover:bg-gray-200 text-gray-800 border border-gray-300">English</button>
      </div>

      <!-- A-Z Alphabet Filter Row -->
      <div class="flex gap-1.5 mt-2 overflow-x-auto no-scrollbar text-xs font-bold text-gray-600">
        <button onclick="setLetter('')" class="letter-btn px-2.5 py-1 rounded-lg bg-white hover:bg-[#C8102E] hover:text-white transition shadow-sm border border-gray-300">ANY</button>
        <script>
          const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ#".split("");
          letters.forEach(l => {
            document.write(`<button onclick="setLetter('${l}')" class="letter-btn px-2.5 py-1 rounded-lg bg-white hover:bg-[#C8102E] hover:text-white transition shadow-sm border border-gray-300">${l}</button>`);
          });
        </script>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="flex justify-between items-center text-xs font-bold text-gray-600 mb-3 px-1">
      <span id="resultCount">Loading database...</span>
      <span id="favCount" class="text-yellow-600">⭐ 0 Saved</span>
    </div>

    <!-- Top Pagination Controls -->
    <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-gray-300 shadow-sm mb-3 text-xs sm:text-sm">
      <button onclick="changePage(-1)" id="prevBtn" class="px-4 py-2 bg-[#C8102E] hover:bg-red-700 disabled:opacity-30 text-white rounded-lg font-bold transition">◀ Prev</button>
      <span id="pageInfo" class="font-extrabold text-[#C8102E]">Page 1 of 1</span>
      <button onclick="changePage(1)" id="nextBtn" class="px-4 py-2 bg-[#C8102E] hover:bg-red-700 disabled:opacity-30 text-white rounded-lg font-bold transition">Next ▶</button>
    </div>

    <!-- Song Table (Songbook Matched Styling) -->
    <div class="bg-white rounded-xl overflow-hidden shadow-xl border-2 border-[#C8102E]">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-[#C8102E] text-white uppercase text-xs font-black tracking-wider border-b-2 border-red-800">
            <th class="p-3 w-10 text-center">⭐</th>
            <th class="p-3 w-28 bg-[#C8102E]">NO.</th>
            <th class="p-3">TITLE</th>
            <th class="p-3">ARTIST</th>
          </tr>
        </thead>
        <tbody id="songTableBody" class="divide-y divide-gray-200 text-sm font-semibold">
          <!-- Populated dynamically -->
        </tbody>
      </table>
    </div>

    <!-- Bottom Pagination Controls -->
    <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-gray-300 shadow-sm mt-3 text-xs sm:text-sm">
      <button onclick="changePage(-1)" id="prevBtnBottom" class="px-4 py-2 bg-[#C8102E] hover:bg-red-700 disabled:opacity-30 text-white rounded-lg font-bold transition">◀ Prev</button>
      <span id="pageInfoBottom" class="font-extrabold text-[#C8102E]">Page 1 of 1</span>
      <button onclick="changePage(1)" id="nextBtnBottom" class="px-4 py-2 bg-[#C8102E] hover:bg-red-700 disabled:opacity-30 text-white rounded-lg font-bold transition">Next ▶</button>
    </div>
  </div>

  <script>
    let songs = [];
    let filteredSongs = [];
    let favorites = new Set(JSON.parse(localStorage.getItem('karaoke_favorites') || "[]"));
    let currentCategory = 'ALL';
    let currentLetter = '';

    let currentPage = 1;
    const itemsPerPage = 100;

    async function loadSongs() {
      try {
        const response = await fetch('songs.json');
        songs = await response.json();
        updateFavCount();
        filterSongs();
      } catch (error) {
        document.getElementById('resultCount').textContent = 'Error loading songs.json file.';
      }
    }

    function toggleFavorite(songNo) {
      if (favorites.has(songNo)) {
        favorites.delete(songNo);
      } else {
        favorites.add(songNo);
      }
      localStorage.setItem('karaoke_favorites', JSON.stringify(Array.from(favorites)));
      updateFavCount();
      filterSongs(false);
    }

    function updateFavCount() {
      document.getElementById('favCount').textContent = `⭐ ${favorites.size} Saved`;
    }

    /* --- Autocomplete / Suggestions Handling --- */
    function handleSearchInput() {
      const inputVal = document.getElementById('searchInput').value.toLowerCase().trim();
      const suggestionsBox = document.getElementById('suggestionsBox');

      filterSongs(true);

      if (inputVal.length < 2) {
        suggestionsBox.classList.add('hidden');
        return;
      }

      const suggestions = filteredSongs.slice(0, 6);

      if (suggestions.length === 0) {
        suggestionsBox.classList.add('hidden');
        return;
      }

      suggestionsBox.innerHTML = suggestions.map(song => `
        <div 
          onclick="selectSuggestion('${song.title.replace(/'/g, "\\'")}')" 
          class="p-3 hover:bg-yellow-50 cursor-pointer flex items-center justify-between text-sm transition"
        >
          <div class="flex items-center gap-2 overflow-hidden">
            <span class="font-mono font-black text-black bg-[#FFE600] px-1.5 py-0.5 rounded text-xs border border-yellow-400">${song.no}</span>
            <span class="font-bold text-gray-900 truncate">${song.title}</span>
          </div>
          <span class="text-xs text-gray-500 truncate max-w-[120px] font-semibold">${song.artist || 'Unknown'}</span>
        </div>
      `).join('');

      suggestionsBox.classList.remove('hidden');
    }

    function selectSuggestion(title) {
      const searchInput = document.getElementById('searchInput');
      searchInput.value = title;
      hideSuggestions();
      filterSongs(true);
    }

    function hideSuggestions() {
      document.getElementById('suggestionsBox').classList.add('hidden');
    }

    function filterSongs(resetPage = true) {
      if (resetPage) currentPage = 1;

      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      filteredSongs = songs.filter(song => {
        const matchesQuery = String(song.no).toLowerCase().includes(query) ||
                             String(song.title).toLowerCase().includes(query) ||
                             (song.artist && String(song.artist).toLowerCase().includes(query));

        let matchesCategory = true;
        if (currentCategory === 'FAV') {
          matchesCategory = favorites.has(song.no);
        } else if (currentCategory === '2026') {
          matchesCategory = (song.year === 2026 || song.year === "2026");
        } else if (currentCategory !== 'ALL') {
          matchesCategory = (song.lang && String(song.lang).toLowerCase() === currentCategory.toLowerCase());
        }

        let matchesLetter = true;
        if (currentLetter) {
          if (currentLetter === '#') {
            matchesLetter = /^[0-9]/.test(song.title);
          } else {
            matchesLetter = String(song.title).toUpperCase().startsWith(currentLetter);
          }
        }

        return matchesQuery && matchesCategory && matchesLetter;
      });

      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('songTableBody');
      const countLabel = document.getElementById('resultCount');
      const totalPages = Math.ceil(filteredSongs.length / itemsPerPage) || 1;

      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIdx = (currentPage - 1) * itemsPerPage;
      const endIdx = startIdx + itemsPerPage;
      const pageData = filteredSongs.slice(startIdx, endIdx);

      tbody.innerHTML = '';
      countLabel.textContent = `Showing ${filteredSongs.length.toLocaleString()} song(s)`;

      const pageText = `Page ${currentPage} of ${totalPages.toLocaleString()}`;
      document.getElementById('pageInfo').textContent = pageText;
      document.getElementById('pageInfoBottom').textContent = pageText;

      const disablePrev = currentPage === 1;
      const disableNext = currentPage >= totalPages;

      document.getElementById('prevBtn').disabled = disablePrev;
      document.getElementById('prevBtnBottom').disabled = disablePrev;
      document.getElementById('nextBtn').disabled = disableNext;
      document.getElementById('nextBtnBottom').disabled = disableNext;

      if (pageData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-500 font-bold">No matching songs found.</td></tr>`;
        return;
      }

      pageData.forEach(song => {
        const isFav = favorites.has(song.no);
        const is2026 = song.year === 2026 || song.year === "2026";

        const row = document.createElement('tr');
        row.className = "hover:bg-yellow-50 transition-colors border-b border-gray-200";
        row.innerHTML = `
          <td class="p-3 text-center cursor-pointer select-none text-base" onclick="toggleFavorite('${song.no}')">
            ${isFav ? '⭐' : '☆'}
          </td>
          <td class="p-3 font-mono font-black text-black bg-[#FFE600] border-r border-yellow-300 text-center tracking-wide">
            ${song.no}
          </td>
          <td class="p-3 font-bold text-gray-900 flex items-center gap-2 flex-wrap">
            <span>${song.title}</span>
            ${is2026 ? `<span class="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-full border border-emerald-300 font-extrabold">NEW 2026</span>` : ''}
          </td>
          <td class="p-3 text-gray-700 font-semibold">${song.artist || 'Unknown'}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function changePage(direction) {
      currentPage += direction;
      renderTable();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.classList.remove('bg-[#C8102E]', 'text-white');
        b.classList.add('bg-white', 'text-gray-800');
      });
      const activeBtn = document.getElementById(`btn-${cat}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white', 'text-gray-800');
        activeBtn.classList.add('bg-[#C8102E]', 'text-white');
      }
      filterSongs(true);
    }

    function setLetter(letter) {
      currentLetter = letter;
      filterSongs(true);
    }

    loadSongs();
  </script>
</body>
</html>
