<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoke Songbook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 transition-colors duration-200 min-h-screen" id="appBody">

  <div class="max-w-4xl mx-auto p-4">
    <!-- Header -->
    <header class="flex justify-between items-center py-4 mb-2 border-b border-slate-800">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-pink-500 tracking-wider flex items-center gap-2">
          🎤 KARAOKE SONGBOOK
        </h1>
        <p class="text-xs text-gray-400 mt-1">Instant Search & Mobile Songbook</p>
      </div>
      <button onclick="toggleTheme()" class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-semibold flex items-center gap-2 transition border border-slate-700">
        <span id="themeIcon">🌙</span> <span id="themeLabel" class="hidden sm:inline">Dark</span>
      </button>
    </header>

    <!-- Search & Filters Header -->
    <div class="sticky top-0 z-20 bg-slate-900 pt-2 pb-3">
      <div class="relative">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search song #, title, or artist..." 
          class="w-full p-4 pl-12 rounded-2xl bg-slate-800 border border-slate-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-pink-500 shadow-xl text-base sm:text-lg"
          oninput="onFilterChange()"
        />
        <span class="absolute left-4 top-4 text-gray-400 text-xl">🔍</span>
      </div>

      <!-- Main Category Filter Tabs -->
      <div class="flex gap-2 mt-3 overflow-x-auto no-scrollbar pb-1 text-sm font-semibold">
        <button onclick="setCategory('ALL')" id="btn-ALL" class="cat-btn px-4 py-2 rounded-xl bg-pink-600 text-white shadow">All Songs</button>
        <button onclick="setCategory('FAV')" id="btn-FAV" class="cat-btn px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-yellow-400 border border-slate-700">⭐ Favorites</button>
        <button onclick="setCategory('2026')" id="btn-2026" class="cat-btn px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700">✨ 2026 Hits</button>
        <button onclick="setCategory('OPM')" id="btn-OPM" class="cat-btn px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white border border-slate-700">OPM</button>
        <button onclick="setCategory('English')" id="btn-English" class="cat-btn px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white border border-slate-700">English</button>
      </div>

      <!-- A-Z Alphabet Filter Row -->
      <div class="flex gap-1.5 mt-2 overflow-x-auto no-scrollbar text-xs font-bold text-gray-400">
        <button onclick="setLetter('')" class="letter-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-pink-600 hover:text-white transition">ANY</button>
        <script>
          const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ#".split("");
          letters.forEach(l => {
            document.write(`<button onclick="setLetter('${l}')" class="letter-btn px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-pink-600 hover:text-white transition">${l}</button>`);
          });
        </script>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="flex justify-between items-center text-xs text-gray-400 mb-3 px-1">
      <span id="resultCount">Loading database...</span>
      <span id="favCount" class="text-yellow-400 font-medium">⭐ 0 Saved</span>
    </div>

    <!-- Top Pagination Controls -->
    <div class="flex justify-between items-center bg-slate-800/80 p-3 rounded-xl border border-slate-700 mb-3 text-xs sm:text-sm">
      <button onclick="changePage(-1)" id="prevBtn" class="px-4 py-2 bg-slate-700 hover:bg-pink-600 disabled:opacity-30 disabled:hover:bg-slate-700 rounded-lg font-bold transition">◀ Prev</button>
      <span id="pageInfo" class="font-medium text-pink-400">Page 1 of 1</span>
      <button onclick="changePage(1)" id="nextBtn" class="px-4 py-2 bg-slate-700 hover:bg-pink-600 disabled:opacity-30 disabled:hover:bg-slate-700 rounded-lg font-bold transition">Next ▶</button>
    </div>

    <!-- Song Table -->
    <div class="bg-slate-800 rounded-2xl overflow-hidden shadow-2xl border border-slate-700/80">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-950/80 text-pink-400 uppercase text-xs tracking-wider border-b border-slate-700">
            <th class="p-3.5 w-12 text-center">⭐</th>
            <th class="p-3.5 w-24">NO.</th>
            <th class="p-3.5">TITLE</th>
            <th class="p-3.5">ARTIST</th>
          </tr>
        </thead>
        <tbody id="songTableBody" class="divide-y divide-slate-700/60 text-sm">
          <!-- Populated dynamically -->
        </tbody>
      </table>
    </div>

    <!-- Bottom Pagination Controls -->
    <div class="flex justify-between items-center bg-slate-800/80 p-3 rounded-xl border border-slate-700 mt-3 text-xs sm:text-sm">
      <button onclick="changePage(-1)" id="prevBtnBottom" class="px-4 py-2 bg-slate-700 hover:bg-pink-600 disabled:opacity-30 disabled:hover:bg-slate-700 rounded-lg font-bold transition">◀ Prev</button>
      <span id="pageInfoBottom" class="font-medium text-pink-400">Page 1 of 1</span>
      <button onclick="changePage(1)" id="nextBtnBottom" class="px-4 py-2 bg-slate-700 hover:bg-pink-600 disabled:opacity-30 disabled:hover:bg-slate-700 rounded-lg font-bold transition">Next ▶</button>
    </div>
  </div>

  <script>
    let songs = [];
    let filteredSongs = [];
    let favorites = new Set(JSON.parse(localStorage.getItem('karaoke_favorites') || "[]"));
    let currentCategory = 'ALL';
    let currentLetter = '';
    let isDarkMode = true;

    let currentPage = 1;
    const itemsPerPage = 100;

    async function loadSongs() {
      try {
        const response = await fetch('songs.json');
        songs = await response.json();
        updateFavCount();
        filterSongs();
      } catch (error) {
        document.getElementById('resultCount').textContent = 'Error loading songs.json file.';
      }
    }

    function toggleFavorite(songNo) {
      if (favorites.has(songNo)) {
        favorites.delete(songNo);
      } else {
        favorites.add(songNo);
      }
      localStorage.setItem('karaoke_favorites', JSON.stringify(Array.from(favorites)));
      updateFavCount();
      filterSongs(false);
    }

    function updateFavCount() {
      document.getElementById('favCount').textContent = `⭐ ${favorites.size} Saved`;
    }

    function filterSongs(resetPage = true) {
      if (resetPage) currentPage = 1;

      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      filteredSongs = songs.filter(song => {
        const matchesQuery = String(song.no).toLowerCase().includes(query) ||
                             String(song.title).toLowerCase().includes(query) ||
                             (song.artist && String(song.artist).toLowerCase().includes(query));

        let matchesCategory = true;
        if (currentCategory === 'FAV') {
          matchesCategory = favorites.has(song.no);
        } else if (currentCategory === '2026') {
          matchesCategory = (song.year === 2026 || song.year === "2026");
        } else if (currentCategory !== 'ALL') {
          matchesCategory = (song.lang && String(song.lang).toLowerCase() === currentCategory.toLowerCase());
        }

        let matchesLetter = true;
        if (currentLetter) {
          if (currentLetter === '#') {
            matchesLetter = /^[0-9]/.test(song.title);
          } else {
            matchesLetter = String(song.title).toUpperCase().startsWith(currentLetter);
          }
        }

        return matchesQuery && matchesCategory && matchesLetter;
      });

      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('songTableBody');
      const countLabel = document.getElementById('resultCount');
      const totalPages = Math.ceil(filteredSongs.length / itemsPerPage) || 1;

      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIdx = (currentPage - 1) * itemsPerPage;
      const endIdx = startIdx + itemsPerPage;
      const pageData = filteredSongs.slice(startIdx, endIdx);

      tbody.innerHTML = '';
      countLabel.textContent = `Showing ${filteredSongs.length.toLocaleString()} song(s)`;

      const pageText = `Page ${currentPage} of ${totalPages.toLocaleString()}`;
      document.getElementById('pageInfo').textContent = pageText;
      document.getElementById('pageInfoBottom').textContent = pageText;

      const disablePrev = currentPage === 1;
      const disableNext = currentPage >= totalPages;

      document.getElementById('prevBtn').disabled = disablePrev;
      document.getElementById('prevBtnBottom').disabled = disablePrev;
      document.getElementById('nextBtn').disabled = disableNext;
      document.getElementById('nextBtnBottom').disabled = disableNext;

      if (pageData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-400">No matching songs found.</td></tr>`;
        return;
      }

      pageData.forEach(song => {
        const isFav = favorites.has(song.no);
        const is2026 = song.year === 2026 || song.year === "2026";

        const row = document.createElement('tr');
        row.className = "hover:bg-slate-700/50 transition-colors";
        row.innerHTML = `
          <td class="p-3.5 text-center cursor-pointer select-none text-lg" onclick="toggleFavorite('${song.no}')">
            ${isFav ? '⭐' : '☆'}
          </td>
          <td class="p-3.5 font-mono font-bold text-pink-400">${song.no}</td>
          <td class="p-3.5 font-medium text-white flex items-center gap-2 flex-wrap">
            <span>${song.title}</span>
            ${is2026 ? `<span class="bg-emerald-500/20 text-emerald-400 text-[10px] px-2 py-0.5 rounded-full border border-emerald-500/40 font-bold">NEW 2026</span>` : ''}
          </td>
          <td class="p-3.5 text-gray-300">${song.artist || 'Unknown'}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function changePage(direction) {
      currentPage += direction;
      renderTable();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function onFilterChange() {
      filterSongs(true);
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.classList.remove('bg-pink-600', 'text-white');
        b.classList.add('bg-slate-800', 'text-gray-300');
      });
      const activeBtn = document.getElementById(`btn-${cat}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-slate-800', 'text-gray-300');
        activeBtn.classList.add('bg-pink-600', 'text-white');
      }
      filterSongs(true);
    }

    function setLetter(letter) {
      currentLetter = letter;
      filterSongs(true);
    }

    function toggleTheme() {
      isDarkMode = !isDarkMode;
      document.documentElement.classList.toggle('dark', isDarkMode);
      document.getElementById('themeIcon').textContent = isDarkMode ? '🌙' : '☀️';
      document.getElementById('themeLabel').textContent = isDarkMode ? 'Dark' : 'Light';
    }

    loadSongs();
  </script>
</body>
</html>
