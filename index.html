<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoke Songbook</title>
  
  <!-- Google Fonts: Roboto & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #F8F9FA; /* Material Soft Neutral Background */
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-gray-900 min-h-screen" onclick="hideSuggestions()">

  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    
    <!-- Material Top Bar / Header -->
    <header class="flex justify-between items-center py-4 mb-4 bg-[#FFF5F5] px-6 rounded-3xl border border-red-100 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-[#C8102E] text-white flex items-center gap-0 justify-center text-xl shadow-sm">
          🎤
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-[#A60D25] tracking-tight">
            Karaoke Songbook
          </h1>
          <p class="text-xs text-gray-500 font-medium">Material 3 Soft Red & Gold Theme</p>
        </div>
      </div>
    </header>

    <!-- Material Sticky Search & Filter Container -->
    <div class="sticky top-2 z-20 bg-[#F8F9FA]/90 backdrop-blur-md pt-2 pb-4">
      
      <!-- Elevated Search Bar Bar -->
      <div class="relative" onclick="event.stopPropagation()">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search song #, title, or artist..." 
          class="w-full p-4 pl-12 pr-4 rounded-3xl bg-white border border-red-200 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#C8102E] shadow-sm hover:shadow-md transition text-base font-medium"
          oninput="handleSearchInput()"
          onfocus="handleSearchInput()"
          autocomplete="off"
        />
        <span class="absolute left-4 top-4 text-red-500 text-xl">🔍</span>

        <!-- Material Autocomplete Suggestions Menu -->
        <div id="suggestionsBox" class="hidden absolute left-0 right-0 top-full mt-2 bg-white border border-red-100 rounded-3xl shadow-xl z-30 max-h-64 overflow-y-auto divide-y divide-gray-50 p-2">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Category Filter Chips (Pill Shaped) -->
      <div class="flex gap-2 mt-4 overflow-x-auto no-scrollbar pb-1 text-xs font-medium">
        <button onclick="setCategory('ALL')" id="btn-ALL" class="cat-btn px-5 py-2.5 rounded-full bg-[#C8102E] text-white shadow-sm transition">All Songs</button>
        <button onclick="setCategory('FAV')" id="btn-FAV" class="cat-btn px-5 py-2.5 rounded-full bg-white hover:bg-yellow-50 text-yellow-700 border border-yellow-200 transition">⭐ Favorites</button>
        <button onclick="setCategory('2026')" id="btn-2026" class="cat-btn px-5 py-2.5 rounded-full bg-white hover:bg-emerald-50 text-emerald-700 border border-emerald-200 transition">✨ 2026 Hits</button>
        <button onclick="setCategory('OPM')" id="btn-OPM" class="cat-btn px-5 py-2.5 rounded-full bg-white hover:bg-red-50 text-gray-700 border border-gray-200 transition">OPM</button>
        <button onclick="setCategory('English')" id="btn-English" class="cat-btn px-5 py-2.5 rounded-full bg-white hover:bg-red-50 text-gray-700 border border-gray-200 transition">English</button>
      </div>

      <!-- A-Z Alphabet Filter Row (Material Tonal Buttons) -->
      <div class="flex gap-1.5 mt-2 overflow-x-auto no-scrollbar text-xs font-semibold text-gray-600">
        <button onclick="setLetter('')" class="letter-btn px-3 py-1.5 rounded-xl bg-white hover:bg-[#C8102E] hover:text-white transition shadow-2xs border border-gray-200">ANY</button>
        <script>
          const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ#".split("");
          letters.forEach(l => {
            document.write(`<button onclick="setLetter('${l}')" class="letter-btn px-3 py-1.5 rounded-xl bg-white hover:bg-[#C8102E] hover:text-white transition shadow-2xs border border-gray-200">${l}</button>`);
          });
        </script>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="flex justify-between items-center text-xs font-semibold text-gray-500 mb-3 px-2">
      <span id="resultCount">Loading database...</span>
      <span id="favCount" class="text-amber-600 font-bold">⭐ 0 Saved</span>
    </div>

    <!-- Top Pagination Bar -->
    <div class="flex justify-between items-center bg-white p-2.5 px-4 rounded-2xl border border-gray-100 shadow-2xs mb-3 text-xs sm:text-sm">
      <button onclick="changePage(-1)" id="prevBtn" class="px-4 py-2 bg-red-50 hover:bg-[#C8102E] text-[#C8102E] hover:text-white disabled:opacity-30 rounded-xl font-bold transition">◀ Prev</button>
      <span id="pageInfo" class="font-bold text-[#A60D25]">Page 1 of 1</span>
      <button onclick="changePage(1)" id="nextBtn" class="px-4 py-2 bg-red-50 hover:bg-[#C8102E] text-[#C8102E] hover:text-white disabled:opacity-30 rounded-xl font-bold transition">Next ▶</button>
    </div>

    <!-- Material Card Viewport Table -->
    <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-[#FFF0F2] text-[#A60D25] uppercase text-xs font-bold tracking-wider border-b border-red-100">
            <th class="p-3.5 w-10 text-center">⭐</th>
            <th class="p-3.5 w-24">NO.</th>
            <th class="p-3.5">TITLE</th>
            <th class="p-3.5">ARTIST</th>
          </tr>
        </thead>
        <tbody id="songTableBody" class="divide-y divide-gray-100 text-sm">
          <!-- Populated dynamically -->
        </tbody>
      </table>
    </div>

    <!-- Bottom Pagination Bar -->
    <div class="flex justify-between items-center bg-white p-2.5 px-4 rounded-2xl border border-gray-100 shadow-2xs mt-3 text-xs sm:text-sm">
      <button onclick="changePage(-1)" id="prevBtnBottom" class="px-4 py-2 bg-red-50 hover:bg-[#C8102E] text-[#C8102E] hover:text-white disabled:opacity-30 rounded-xl font-bold transition">◀ Prev</button>
      <span id="pageInfoBottom" class="font-bold text-[#A60D25]">Page 1 of 1</span>
      <button onclick="changePage(1)" id="nextBtnBottom" class="px-4 py-2 bg-red-50 hover:bg-[#C8102E] text-[#C8102E] hover:text-white disabled:opacity-30 rounded-xl font-bold transition">Next ▶</button>
    </div>
  </div>

  <script>
    let songs = [];
    let filteredSongs = [];
    let favorites = new Set(JSON.parse(localStorage.getItem('karaoke_favorites') || "[]"));
    let currentCategory = 'ALL';
    let currentLetter = '';

    let currentPage = 1;
    const itemsPerPage = 100;

    async function loadSongs() {
      try {
        const response = await fetch('songs.json');
        songs = await response.json();
        updateFavCount();
        filterSongs();
      } catch (error) {
        document.getElementById('resultCount').textContent = 'Error loading songs.json file.';
      }
    }

    function toggleFavorite(songNo) {
      if (favorites.has(songNo)) {
        favorites.delete(songNo);
      } else {
        favorites.add(songNo);
      }
      localStorage.setItem('karaoke_favorites', JSON.stringify(Array.from(favorites)));
      updateFavCount();
      filterSongs(false);
    }

    function updateFavCount() {
      document.getElementById('favCount').textContent = `⭐ ${favorites.size} Saved`;
    }

    /* --- Material Autocomplete Handling --- */
    function handleSearchInput() {
      const inputVal = document.getElementById('searchInput').value.toLowerCase().trim();
      const suggestionsBox = document.getElementById('suggestionsBox');

      filterSongs(true);

      if (inputVal.length < 2) {
        suggestionsBox.classList.add('hidden');
        return;
      }

      const suggestions = filteredSongs.slice(0, 6);

      if (suggestions.length === 0) {
        suggestionsBox.classList.add('hidden');
        return;
      }

      suggestionsBox.innerHTML = suggestions.map(song => `
        <div 
          onclick="selectSuggestion('${song.title.replace(/'/g, "\\'")}')" 
          class="p-3 hover:bg-yellow-50/80 rounded-2xl cursor-pointer flex items-center justify-between text-sm transition"
        >
          <div class="flex items-center gap-3 overflow-hidden">
            <span class="font-mono font-bold text-gray-900 bg-[#FFF3A1] px-2 py-0.5 rounded-lg text-xs border border-yellow-300">${song.no}</span>
            <span class="font-medium text-gray-900 truncate">${song.title}</span>
          </div>
          <span class="text-xs text-gray-500 truncate max-w-[120px] font-normal">${song.artist || 'Unknown'}</span>
        </div>
      `).join('');

      suggestionsBox.classList.remove('hidden');
    }

    function selectSuggestion(title) {
      const searchInput = document.getElementById('searchInput');
      searchInput.value = title;
      hideSuggestions();
      filterSongs(true);
    }

    function hideSuggestions() {
      document.getElementById('suggestionsBox').classList.add('hidden');
    }

    function filterSongs(resetPage = true) {
      if (resetPage) currentPage = 1;

      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      filteredSongs = songs.filter(song => {
        const matchesQuery = String(song.no).toLowerCase().includes(query) ||
                             String(song.title).toLowerCase().includes(query) ||
                             (song.artist && String(song.artist).toLowerCase().includes(query));

        let matchesCategory = true;
        if (currentCategory === 'FAV') {
          matchesCategory = favorites.has(song.no);
        } else if (currentCategory === '2026') {
          matchesCategory = (song.year === 2026 || song.year === "2026");
        } else if (currentCategory !== 'ALL') {
          matchesCategory = (song.lang && String(song.lang).toLowerCase() === currentCategory.toLowerCase());
        }

        let matchesLetter = true;
        if (currentLetter) {
          if (currentLetter === '#') {
            matchesLetter = /^[0-9]/.test(song.title);
          } else {
            matchesLetter = String(song.title).toUpperCase().startsWith(currentLetter);
          }
        }

        return matchesQuery && matchesCategory && matchesLetter;
      });

      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('songTableBody');
      const countLabel = document.getElementById('resultCount');
      const totalPages = Math.ceil(filteredSongs.length / itemsPerPage) || 1;

      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIdx = (currentPage - 1) * itemsPerPage;
      const endIdx = startIdx + itemsPerPage;
      const pageData = filteredSongs.slice(startIdx, endIdx);

      tbody.innerHTML = '';
      countLabel.textContent = `Showing ${filteredSongs.length.toLocaleString()} song(s)`;

      const pageText = `Page ${currentPage} of ${totalPages.toLocaleString()}`;
      document.getElementById('pageInfo').textContent = pageText;
      document.getElementById('pageInfoBottom').textContent = pageText;

      const disablePrev = currentPage === 1;
      const disableNext = currentPage >= totalPages;

      document.getElementById('prevBtn').disabled = disablePrev;
      document.getElementById('prevBtnBottom').disabled = disablePrev;
      document.getElementById('nextBtn').disabled = disableNext;
      document.getElementById('nextBtnBottom').disabled = disableNext;

      if (pageData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-400 font-medium">No matching songs found.</td></tr>`;
        return;
      }

      pageData.forEach(song => {
        const isFav = favorites.has(song.no);
        const is2026 = song.year === 2026 || song.year === "2026";

        const row = document.createElement('tr');
        row.className = "hover:bg-red-50/40 transition-colors border-b border-gray-100";
        row.innerHTML = `
          <td class="p-3 text-center cursor-pointer select-none text-base" onclick="toggleFavorite('${song.no}')">
            ${isFav ? '⭐' : '☆'}
          </td>
          <td class="p-3 font-mono font-extrabold text-gray-900 bg-[#FFF3A1] border-r border-yellow-200/80 text-center tracking-wide rounded-l-md">
            ${song.no}
          </td>
          <td class="p-3.5 font-bold text-gray-800 flex items-center gap-2 flex-wrap">
            <span>${song.title}</span>
            ${is2026 ? `<span class="bg-emerald-100 text-emerald-800 text-[10px] px-2.5 py-0.5 rounded-full font-bold">NEW 2026</span>` : ''}
          </td>
          <td class="p-3.5 text-gray-600 font-medium">${song.artist || 'Unknown'}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function changePage(direction) {
      currentPage += direction;
      renderTable();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.classList.remove('bg-[#C8102E]', 'text-white');
        b.classList.add('bg-white', 'text-gray-700');
      });
      const activeBtn = document.getElementById(`btn-${cat}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white', 'text-gray-700');
        activeBtn.classList.add('bg-[#C8102E]', 'text-white');
      }
      filterSongs(true);
    }

    function setLetter(letter) {
      currentLetter = letter;
      filterSongs(true);
    }

    loadSongs();
  </script>
</body>
</html>
